[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsub"
version = "0.1.0"
description = "Automate Jellyfin subtitle fetching and fitting (timing offset + runtime clamp)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
align = ["vosk>=0.3.45", "imageio-ffmpeg>=0.4"]
test = ["pytest>=8"]

[project.scripts]
jsub = "jsub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
